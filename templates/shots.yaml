# === Sequence Templates ===

sequence_base:
  parent: base
  pattern: "{root}/{project}/sequences/{sequence}"
  metadata:
    type: sequence

# === Shot Templates ===

shot_base:
  parent: sequence_base
  pattern: "{root}/{project}/sequences/{sequence}/{shot}"
  metadata:
    type: shot

shot_workfile:
  parent: shot_base
  pattern: "{root}/{project}/sequences/{sequence}/{shot}/work/{task}/{shot}_{task}_v{version}.{ext}"
  defaults:
    ext: nk
    version: "001"
  tags: ["workfile", "shot"]

shot_publish:
  parent: shot_base
  pattern: "{root}/{project}/sequences/{sequence}/{shot}/publish/{task}/{shot}_{task}_v{version}.{ext}"
  defaults:
    ext: exr
    version: "001"
  tags: ["publish", "shot"]

# === Review Templates ===
review_mov:
  parent: shot_publish
  pattern: "{root}/{project}/review/{sequence}/{shot}/{shot}_{task}_v{version}.mov"
  defaults:
    ext: mov
  tags: [ "review", "shot", "output" ]

# === Render Output ===

render_frames:
  parent: shot_publish
  pattern: "{root}/{project}/sequences/{sequence}/{shot}/render/{task}/{shot}_{task}_v{version}/{shot}_{task}_v{version}.{frame}.{ext}"
  defaults:
    ext: exr
    frame: "####"
  tags: ["render", "output"]