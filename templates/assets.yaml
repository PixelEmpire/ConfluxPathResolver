asset_base:
  parent: base
  pattern: "{root}/{project}/assets/{asset_type}/{asset_name}"
  metadata:
    type: asset

asset_workfile:
  parent: asset_base
  pattern: "{root}/{project}/assets/{asset_type}/{asset_name}/work/{task}/{asset_name}_{task}_v{version}.{ext}"
  defaults:
    ext: ma
    version: "001"
  tags: ["workfile", "asset"]

asset_publish:
  parent: asset_base
  pattern: "{root}/{project}/assets/{asset_type}/{asset_name}/publish/{task}/{asset_name}_{task}_v{version}.{ext}"
  defaults:
    ext: abc
    version: "001"
  tags: ["publish", "asset"]